<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc mừng 20-10 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:'Quicksand',sans-serif;
  background:#f3eaea;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

/* CARD GIỮA */
.card{
  background:white;
  padding:50px 70px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 15px 40px rgba(255,100,150,0.3);
  z-index:2;
}

.card h1{
  color:#ff4e8b;
  margin:0;
}

.card h2{
  font-weight:400;
  color:#ff4e8b;
}

.card p{
  color:#ff4e8b;
}

button{
  margin-top:20px;
  padding:15px 40px;
  border:none;
  border-radius:50px;
  background:linear-gradient(45deg,#ff4e8b,#ff7eb3);
  color:white;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 5px 15px rgba(255,0,100,0.4);
}

button:hover{
  transform:scale(1.1);
}

/* ICON RƠI */
.fall{
  position:absolute;
  top:-50px;
  font-size:24px;
  animation:fall linear infinite;
  opacity:0.8;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
  }
}


@keyframes heartRun{
  0%{ left:-50px; }
  100%{ left:110%; }
}


@keyframes catChase{
  0%{ left:-150px; }
  100%{ left:100%; }
}
</style>
</head>
<body>

<div class="card">
  <h1>Chúc mừng 20-10</h1>
  <h2>Ngày Phụ nữ Việt Nam</h2>
  <p>Mong bạn luôn rạng rỡ như những bó hoa!</p>
  <button onclick="goNext()">💖 Xem tiếp 💖</button>
</div>

<!-- Mèo gif -->
<img src="https://keng-8.github.io/20-10/2010/assets/mewmew.gif" alt="GIF" class="cat">

<script>
function goNext(){
  window.location.href="gallery.html";
}

/* Tạo icon rơi */
function createFall(){
  const icons=["💌","🌸","💖","🌷"];
  const item=document.createElement("div");
  item.classList.add("fall");
  item.innerHTML=icons[Math.floor(Math.random()*icons.length)];
  item.style.left=Math.random()*100+"vw";
  item.style.animationDuration=(3+Math.random()*5)+"s";
  document.body.appendChild(item);

  setTimeout(()=>{item.remove();},8000);
}

setInterval(createFall,800);
</script>

</body>
</html>
